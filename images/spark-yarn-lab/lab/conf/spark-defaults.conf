# Platform shape for Chapter 2 labs. Learners may override on the submit line.
spark.master                     yarn
spark.eventLog.enabled           true
spark.eventLog.dir               file:///opt/spark/work/eventlogs
spark.history.fs.logDirectory    file:///opt/spark/work/eventlogs
spark.yarn.archive               local:/opt/spark-yarn-jars.tgz
spark.executor.instances         2
spark.executor.cores             1
spark.executor.memory            512m
spark.executor.memoryOverhead    384m
spark.driver.memory              512m
spark.yarn.am.memory             512m
spark.yarn.am.memoryOverhead     384m
spark.yarn.appMasterEnv.PYSPARK_PYTHON python3
spark.executorEnv.PYSPARK_PYTHON python3
spark.pyspark.python             python3
spark.pyspark.driver.python      python3
