# Elastic Projects-shell capacity on top of the labs-projects managed node group (the
# always-on base, env.sh). Karpenter buys a node only when a projects box is Pending
# (base full) and removes it once empty. Same label, taint and shape as the base;
# tainted so only projects shells land here.
#
# A projects box requests 100m / 256Mi (limit 1000m / 768Mi — compiles need headroom).
# t4g.small is 2 vCPU / 2 GiB. After kube-reserved (~387 Mi at maxPods 12) and ~4 DaemonSets,
# memory requests cap density at roughly 5 shells per node. maxPods 12 leaves slots for
# DaemonSets + a few more pods than memory allows.
# kube-reserved memory = 11 × maxPods + 255 Mi.
# Keep maxPods / kubeReserved / podPidsLimit / disk in sync with EKS_PROJECTS_* in env.sh.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: labs-projects-elastic
spec:
  role: KarpenterNodeRole-devlabs
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: devlabs
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: devlabs
  kubelet:
    maxPods: 12
    kubeReserved:
      cpu: 70m
      memory: 387Mi
      ephemeral-storage: 1Gi
  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="BOUNDARY"

    --BOUNDARY
    Content-Type: application/node.eks.aws

    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      kubelet:
        config:
          podPidsLimit: 512
    --BOUNDARY
    Content-Type: text/x-shellscript; charset="us-ascii"

    #!/bin/bash
    # Nothing in the labs uses io_uring, and it is a frequent source of kernel privilege
    # escalation bugs reachable from containers. Same as the managed groups (nodegroups.sh).
    printf 'kernel.io_uring_disabled = 2\n' > /etc/sysctl.d/90-devlabs-learner.conf
    sysctl -p /etc/sysctl.d/90-devlabs-learner.conf
    --BOUNDARY--
  # IMDS for the host only: learner pods cannot reach the node role's credentials.
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 40Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  tags:
    devlabs.io/pool: projects
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: labs-projects-elastic
spec:
  template:
    metadata:
      labels:
        devlabs.io/pool: projects
        devlabs.io/tier: elastic
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: labs-projects-elastic
      taints:
        - key: devlabs.io/pool
          value: projects
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t4g.small"]
      expireAfter: 720h
  # Up to 2 extra t4g.small (2 vCPU each) on top of the base.
  limits:
    cpu: "4"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
